<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ede6d2" />
  <title>THR-II Controller</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="src/ui/runtime/runtime.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { main } from './src/app/main.js';
    // Optional plug-in (the AI button and its screen), offered only when its proxy answers (offline it is left out).
    import { aiAvailable } from './src/ai/api.js';
    import { aiPresetSource } from './src/ai/aiPresets.js';

    main(document.getElementById('app'), {
      onStatus: text => console.info(text),
      presetSources: (await aiAvailable()) ? { importAi: aiPresetSource } : {}
    });
  </script>
</body>
</html>

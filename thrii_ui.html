<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ede6d2" />
  <title>Yamaha THRII UI - Refined Initial Version</title>
  <link rel="stylesheet" href="src/ui/runtime/runtime.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { flags } from './src/core/flags.js';
    import { createEmptyDeviceState, createStore } from './src/state/shadowStore.js';
    import { createRuntimeIntents } from './src/ui/runtime/intents.js';
    import { mountRuntime } from './src/ui/runtime/mount.js';

    // Runtime page without a device: the store stays empty until a device is connected.
    const store = createStore(createEmptyDeviceState());
    const intents = createRuntimeIntents({
      store,
      flags,
      sendParam: () => {}
    });
    mountRuntime(document.getElementById('app'), { store, intents });
  </script>
</body>
</html>

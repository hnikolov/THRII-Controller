<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THR-II dev: runtime, transports and raw trace</title>
  <link rel="stylesheet" href="src/ui/runtime/runtime.css" />
  <style>
    html, body { overflow: auto; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #ddd; display: block; padding: 0; place-items: normal; }
    .layout { display: grid; grid-template-columns: 390px 1fr; gap: 16px; padding: 16px; box-sizing: border-box; min-height: 100vh; }
    .pane { border: 1px solid #333; border-radius: 8px; padding: 12px; box-sizing: border-box; }
    #runtime-pane { height: 844px; width: 390px; overflow: auto; background: #1b1b1b; padding: 0; border: 0; border-radius: 0; --knob-size: 67px; --center-font-size: 12px; --knob-font-size: 9.4px; }
    .controls button { margin: 4px 4px 4px 0; }
    .raw-trace { height: 70vh; overflow: auto; font: 12px/1.4 Consolas, monospace; white-space: pre-wrap; background: #000; padding: 8px; }
  </style>
</head>
<body>
  <div class="layout">
    <section id="runtime-pane" class="pane"></section>
    <section id="debug-pane" class="pane">
      <div class="controls">
        <button id="btnUsb">Connect USB</button>
        <button id="btnBle">Connect BLE</button>
        <button id="btnDisconnect">Disconnect</button>
        <button id="btnActivate">Activate THR-II</button>
      </div>
      <div id="status">Not connected</div>
      <div id="raw"></div>
    </section>
  </div>
  <script type="module">
    import { boot } from './src/app/boot.js';
    import { createRawObserver } from './src/debug/observer.js';
    import { mountRawTracePanel } from './src/ui/debug/rawTracePanel.js';
    import { flags } from './src/core/flags.js';

    // Dev-only: ?flag=slotSync turns that switch on for this page.
    for (const name of new URLSearchParams(location.search).getAll('flag')) {
      if (name in flags) flags[name] = true;
    }

    const statusEl = document.getElementById('status');

    // ?source=mock loads the captured device model (with its identity). Otherwise the store starts empty.
    const isMock = new URLSearchParams(location.search).get('source') === 'mock';
    const fixture = isMock ? await (await fetch('./test/fixtures/mockState.json')).json() : null;

    // Runtime pane (left): the same composition as thrii_ui.html. Its CONNECT button and the buttons here share one connection.
    const app = await boot(document.getElementById('runtime-pane'), {
      fixture,
      onStatus: text => { statusEl.textContent = text; }
    });
    mountRawTracePanel(document.getElementById('raw'), createRawObserver(app.transports.bus));

    document.getElementById('btnUsb').addEventListener('click', () => app.connect('usb'));
    document.getElementById('btnBle').addEventListener('click', () => app.connect('ble'));
    document.getElementById('btnDisconnect').addEventListener('click', app.disconnect);
    document.getElementById('btnActivate').addEventListener('click', app.activate);
  </script>
</body>
</html>
